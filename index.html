    <script>
        // FIREBASE SETUP
        var firebaseConfig = {
            apiKey: "AIzaSyBe2kQr-75nBWLLE5GDNBvhGFT91FtBbBw",
            authDomain: "makyama-e5e89.firebaseapp.com",
            databaseURL: "https://makyama-e5e89-default-rtdb.firebaseio.com/",
            projectId: "makyama-e5e89",
            storageBucket: "makyama-e5e89.appspot.com",
            messagingSenderId: "229527204095",
            appId: "1:229527204095:web:2bdfe0589cf42794b3dcca"
        };
        try {
            firebase.initializeApp(firebaseConfig);
            var database = firebase.database();
        } catch (error) { console.error("Firebase Error:", error); }

        var isAdmin = false;
        var allFetchedMedia = []; 

        // ADMIN FUNCTIONS
        function openLoginModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeLoginModal() { document.getElementById('loginModal').style.display = 'none'; }
        
        function loginAdmin() {
            var user = document.getElementById('login-username').value;
            var pass = document.getElementById('login-password').value;
            if(user === "MAKYAMA" && pass === "Makame005@") {
                isAdmin = true;
                closeLoginModal();
                document.getElementById('admin-panel').style.display = 'block';
                document.getElementById('nav-action').innerHTML = `<button class="btn-logout" onclick="logoutAdmin()">🚪 Log Out</button>`;
                filterMedia('all'); 
            } else { alert("Incorrect password or username."); }
        }
        
        function logoutAdmin() {
            isAdmin = false;
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('nav-action').innerHTML = `
                <a href="https://wa.me/255740770786" target="_blank" class="btn-wa-header">Contact</a>
                <button onclick="openLoginModal()">🔑 Admin</button>
            `;
            filterMedia('all'); 
        }

        // SAVE CUSTOM MEDIA TO FIREBASE
        function saveMedia() {
            var name = document.getElementById('media-name').value;
            var image = document.getElementById('media-image').value;
            var audio = document.getElementById('media-audio-link').value;
            var editKey = document.getElementById('edit-key').value;

            if(!name || !audio) { alert("Tafadhali weka Jina la wimbo na Link ya Audio."); return; }

            var payload = {
                jina: name,
                picha: image || "https://via.placeholder.com/300x180/252530/aaa?text=MAKYAMA+MEDIA",
                linkAudio: audio,
                views: 0
            };

            if(editKey) {
                database.ref('media/' + editKey).update(payload);
            } else {
                database.ref('media').push(payload);
            }

            document.getElementById('media-name').value = "";
            document.getElementById('media-image').value = "";
            document.getElementById('media-audio-link').value = "";
            document.getElementById('edit-key').value = "";
            alert("Wimbo umewekwa kikamilifu!");
        }

        // SAVE ADS CODE TO FIREBASE
        function saveAdCode() {
            var code = document.getElementById('ad-code-input').value;
            if(!code) return;
            database.ref('settings/adCode').set(code, function(error) {
                if(!error) alert("Matangazo yamebadilishwa kikamilifu! 📢");
            });
        }

        function loadAdCode() {
            database.ref('settings/adCode').on('value', function(snapshot) {
                if(snapshot.exists()) {
                    var code = snapshot.val();
                    document.getElementById('ad-slot').innerHTML = code;
                    document.getElementById('ad-code-input').value = code;
                } else {
                    document.getElementById('ad-slot').innerHTML = `<script async="async" data-cfasync="false" src="https://pl30999047.profitableratecpmnetwork.com/e12d98b2bda8be9d5a35e86f62ca302e/invoke.js"><\/script><div id="container-e12d98b2bda8be9d5a35e86f62ca302e"></div>`;
                }
            });
        }

        // PLAYER FUNCTIONS
        function playAudio(key, link, mediaName, mediaImage) {
            if(key) database.ref('media/' + key + '/views').transaction(v => (v || 0) + 1);
            var playerContainer = document.getElementById('sticky-audio-player');
            var audioTag = document.getElementById('main-audio');
            document.getElementById('player-title').innerText = mediaName;
            document.getElementById('player-img').src = mediaImage || "https://via.placeholder.com/100";
            playerContainer.style.display = 'flex';
            audioTag.src = link;
            audioTag.play();
        }

        function closeAudioPlayer() {
            var audioTag = document.getElementById('main-audio');
            audioTag.pause(); audioTag.src = "";
            document.getElementById('sticky-audio-player').style.display = 'none';
        }

        // DIRECT IN-SITE DOWNLOAD FUNCTION
        async function downloadDirectInSite(fileUrl, fileName, key) {
            if(key) database.ref('media/' + key + '/views').transaction(v => (v || 0) + 1);

            var noti = document.getElementById('download-noti');
            var notiText = document.getElementById('noti-text');
            var notiBar = document.getElementById('noti-bar');

            noti.style.display = 'block';
            notiBar.style.width = '20%';
            notiText.innerText = "Connecting to Server... 20% ⏳";

            try {
                const response = await fetch(fileUrl);
                notiBar.style.width = '60%';
                notiText.innerText = "Fetching Audio File... 60% ⏳";

                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                notiBar.style.width = '100%';
                notiText.innerText = "Download Ready! 100% ✅";

                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = (fileName || 'Makyama_Audio') + '.mp3';
                document.body.appendChild(link);
                link.click();

                setTimeout(() => {
                    document.body.removeChild(link);
                    window.URL.revokeObjectURL(blobUrl);
                    noti.style.display = 'none';
                }, 1200);

            } catch (error) {
                noti.style.display = 'none';
                const windowLink = document.createElement('a');
                windowLink.href = fileUrl;
                windowLink.download = (fileName || 'Makyama_Audio') + '.mp3';
                windowLink.click();
            }
        }

        // GLOBAL SEARCH ENGINE (ITUNES & LOCAL DATABASE)
        async function searchGlobalMedia() {
            var query = document.getElementById("search-input").value.trim();
            if (query === "") return;

            var mainNode = document.getElementById("media-list");
            var relatedTitle = document.getElementById("related-title");
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

            relatedTitle.innerHTML = "🌍 Global Search Results...";
            mainNode.innerHTML = "<p style='text-align:center; color:#00e676; font-size: 14px; padding: 20px;'>Inatafuta nyimbo... ⚡</p>";

            try {
                let url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=15`;
                let response = await fetch(url);
                let data = await response.json();
                
                mainNode.innerHTML = "";

                if (!data.results || data.results.length === 0) {
                    mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>Hakuna nyimbo zilizopatikana. Jaribu kutafuta tena.</p>";
                    return;
                }

                data.results.forEach(item => {
                    let title = item.trackName;
                    let artist = item.artistName;
                    let fullTitle = `${artist} - ${title}`;
                    let thumb = item.artworkUrl100.replace('100x100bb', '300x300bb');
                    let streamUrl = item.previewUrl;
                    let safeTitle = fullTitle.replace(/'/g, "\\'");

                    let card = `
                        <div class="media-card">
                            <img src="${thumb}" onclick="playAudio('', '${streamUrl}', '${safeTitle}', '${thumb}')" style="cursor:pointer;">
                            <div class="media-details">
                                <div class="badge-container">
                                    <span class="badge badge-global">🌍 GLOBAL STREAM</span>
                                </div>
                                <div class="media-title">${fullTitle}</div>
                                <div class="btn-container">
                                    <div class="media-actions">
                                        <button class="btn-action btn-play-audio" onclick="playAudio('', '${streamUrl}', '${safeTitle}', '${thumb}')">▶️ Play</button>
                                        <button class="btn-action btn-dl-audio" onclick="downloadDirectInSite('${streamUrl}', '${safeTitle}')">🎧 Download MP3</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    mainNode.innerHTML += card;
                });

            } catch (error) {
                mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>Matatizo ya mtandao. Jaribu tena baadae.</p>";
            }
        }

        // LOAD NORMAL DATABASE MEDIA
        function loadMedia() {
            document.getElementById("loading").style.display = "block";
            database.ref('media').on('value', function(snapshot) {
                document.getElementById("loading").style.display = "none";
                allFetchedMedia = [];
                if (!snapshot.exists()) return;
                snapshot.forEach(function(childSnapshot) {
                    allFetchedMedia.push({ key: childSnapshot.key, data: childSnapshot.val() });
                });
                allFetchedMedia.reverse(); 
                filterMedia('all');
            });
        }

        function createCard(data, key) {
            var mediaImage = data.picha || "https://via.placeholder.com/300x180/252530/aaa?text=MAKYAMA+MEDIA";
            var audioLink = data.linkAudio;
            var safePlayName = data.jina.replace(/'/g, "\\'");
            var safePlayImage = mediaImage.replace(/'/g, "\\'");

            var btnAudioHTML = audioLink ? `
                <div class="media-actions">
                    <button class="btn-action btn-play-audio" onclick="playAudio('${key}', '${audioLink}', '${safePlayName}', '${safePlayImage}')">▶️ Play</button>
                    <button class="btn-action btn-dl-audio" onclick="downloadDirectInSite('${audioLink}', '${safePlayName}', '${key}')">⬇️ Download MP3</button>
                </div>` : "";

            return `
                <div class="media-card">
                    <img src="${mediaImage}" loading="lazy" style="cursor:pointer;" onclick="playAudio('${key}', '${audioLink}', '${safePlayName}', '${safePlayImage}')">
                    <div class="media-details">
                        <div class="badge-container">
                            <span class="badge">AUDIO</span>
                        </div>
                        <div class="media-title">${data.jina}</div>
                        <div class="btn-container">${btnAudioHTML}</div>
                        <div class="reaction-bar">
                            <button class="reaction-item">👁️ ${data.views || 0} Views</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterMedia(category, btnElement) {
            document.getElementById("search-input").value = "";
            if(btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            var mainNode = document.getElementById("media-list");
            mainNode.innerHTML = "";
            var filteredData = [...allFetchedMedia];

            if (category === 'music') { filteredData = filteredData.filter(item => item.data.linkAudio); } 
            
            if(filteredData.length === 0) { mainNode.innerHTML = "<p style='color:#aaa; text-align:center;'>No music available.</p>"; return; }
            filteredData.forEach(function(item) { mainNode.innerHTML += createCard(item.data, item.key); });
        }

        window.onload = function() { 
            loadMedia(); 
            loadAdCode();
        };
    </script>
</body>
</html>
