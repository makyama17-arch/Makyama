<style>

*{

body{

button{

.primary{

.secondary{

.receive{

.release{

.danger{

.hidden{

.message{

.success{

.error{

.login-buttons{

.agent-row{

.remove{

.stage{

}

.stage.ready{

}

.stage.received{

}

.stage.released{
 border-left-color:#075e54;
}

.stage-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.badge{
 padding:5px 9px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
 white-space:nowrap;
}

.badge.waiting{
 background:#eee;
 color:#555;
}

.badge.ready{
 background:#fff0cf;
 color:#946000;
}

.badge.received{
 background:#dff5e7;
 color:#176b36;
}

.badge.released{
 background:#d8f0ec;
 color:#075e54;
}

.small{
 color:#68737d;
 font-size:13px;
 margin-top:5px;
}

.info-row{
 display:flex;
 justify-content:space-between;
 gap:15px;
 padding:8px 0;
 border-bottom:1px solid #eee;
}

.info-row:last-child{

}

#bossMap,
#agentMap{
 height:400px;
 border-radius:14px;
 overflow:hidden;
}

.timeline-item{
 border-left:3px solid #075e54;
 margin-left:8px;
 padding:12px 12px 12px 20px;

}

.footer{
 text-align:center;
 padding:25px;
 color:#777;

}

@media(max-width:600px){

 .login-buttons{
  grid-template-columns:1fr;
 }

 #bossMap,
 #agentMap{
  height:330px;
 }

 .info-row{
  flex-direction:column;
  gap:3px;
 }

}

</style>
</head>

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
 getDatabase,
 ref,
 set,
 get,
 update,
 push,
 onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ==============================
 FIREBASE
============================== */

const firebaseConfig={

 apiKey:"AIzaSyBe2Qr-75nBWLLE5GDNBvhGFT91FtBbBw",

 authDomain:
 "makyama-e5e89.firebaseapp.com",

 databaseURL:
 "https://makyama-e5e89-default-rtdb.firebaseio.com",

 projectId:
 "makyama-e5e89",

 storageBucket:
 "makyama-e5e89.firebasestorage.app",

 messagingSenderId:
 "229527204095",

 appId:
 "1:229527204095:web:2bdfe0589cf42794b3dcca"

};


const app=
initializeApp(firebaseConfig);

const db=
getDatabase(app);


/* ==============================
 GLOBAL
============================== */

let currentTracking=null;

let currentStageIndex=null;

let currentMode=null;

let cargoListener=null;

let bossMap=null;

let agentMap=null;


/* ==============================
 HELPERS
============================== */

function el(id){
 return document.getElementById(id);
}


function hide(id){
 el(id).classList.add("hidden");
}


function show(id){
 el(id).classList.remove("hidden");
}


function now(){
 return new Date().toISOString();
}


function escapeHTML(v){

 if(v===undefined || v===null)
  return "";

 return String(v)
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}


function formatTime(v){

 if(!v)
  return "-";

 return new Date(v)
 .toLocaleString(
  "sw-TZ",
  {
   dateStyle:"medium",
   timeStyle:"short"
  }
 );

}


function generateTracking(){

 return "DAG-"+
 Math.floor(
  100000+
  Math.random()*900000
 );

}


function generatePIN(){

 return String(
  Math.floor(
   100000+
   Math.random()*900000
  )
 );

}


function message(id,text,type=""){

 el(id).innerHTML=
 `<div class="message ${type}">
 ${text}
 </div>`;

}


/* ==============================
 GPS
============================== */

function getGPS(){

 return new Promise(resolve=>{

  if(!navigator.geolocation){

   resolve(null);
   return;

  }

  navigator.geolocation.getCurrentPosition(

   p=>{

    resolve({

     lat:p.coords.latitude,

     lng:p.coords.longitude,

     accuracy:p.coords.accuracy

    });

   },

   ()=>resolve(null),

   {
    enableHighAccuracy:true,
    timeout:10000,
    maximumAge:0
   }

  );

 });

}


/* ==============================
 LOCATION NAME
============================== */

async function locationName(lat,lng){

 try{

  const response=
   await fetch(
    "https://nominatim.openstreetmap.org/reverse"+
    `?format=json&lat=${lat}&lon=${lng}`+
    "&zoom=18&addressdetails=1"
   );

  const data=
   await response.json();

  if(data){

   const a=data.address||{};

   return(
    a.suburb||
    a.village||
    a.town||
    a.city||
    a.municipality||
    a.county||
    data.display_name||
    "Eneo"
   );

  }

 }catch(e){

  console.log(e);

 }

 return "Eneo la GPS";

}


/* ==============================
 MAP
============================== */

function createMap(id){

 const map=
  L.map(id)
  .setView(
   [-6.8,39.25],
   6
  );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);

 return map;

}


function drawMap(map,cargo){

 if(!map || !cargo)
  return;

 const points=[];


 Object.values(
  cargo.stages||{}
 )
 .sort(
  (a,b)=>
   (a.order||0)-(b.order||0)
 )
 .forEach(stage=>{

  if(stage.receivedLocation){

   const p=
    stage.receivedLocation;

   L.marker(
    [p.lat,p.lng]
   )
   .addTo(map)
   .bindPopup(`
    <b>📍 ${escapeHTML(
     stage.locationName||"Eneo"
    )}</b><br>
    Agent: ${escapeHTML(
     stage.agentName
    )}<br>
    ✓ Nimepokea<br>
    🕐 ${formatTime(
     stage.receivedAt
    )}
   `);

   points.push([
    p.lat,
    p.lng
   ]);

  }


  if(stage.releasedLocation){

   const p=
    stage.releasedLocation;

   L.marker(
    [p.lat,p.lng]
   )
   .addTo(map)
   .bindPopup(`
    <b>📍 ${escapeHTML(
     stage.releasedLocationName||"Eneo"
    )}</b><br>
    Agent: ${escapeHTML(
     stage.agentName
    )}<br>
    ✓ Nimetoa<br>
    🕐 ${formatTime(
     stage.releasedAt
    )}
   `);

   points.push([
    p.lat,
    p.lng
   ]);

  }

 });


 if(cargo.bossReceivedLocation){

  const p=
   cargo.bossReceivedLocation;

  L.marker(
   [p.lat,p.lng]
  )
  .addTo(map)
  .bindPopup(`
   <b>👑 ${escapeHTML(
    cargo.bossReceivedLocationName||"Eneo"
   )}</b><br>
   Boss<br>
   ✓ Nimepokea<br>
   🕐 ${formatTime(
    cargo.bossReceivedAt
   )}
  `);

  points.push([
   p.lat,
   p.lng
  ]);

 }


 if(points.length){

  const line=
   L.polyline(points);

  line.addTo(map);

  map.fitBounds(
   line.getBounds(),
   {
    padding:[30,30]
   }
  );

 }

}


/* ==============================
 REGISTRATION
============================== */

window.showRegistration=function(){

 hide("loginSection");

 show("registrationSection");

 if(
  document.querySelectorAll(
   ".agent-row"
  ).length===0
 ){

  addAgent();
  addAgent();

 }

};


window.backToLogin=function(){

 hide("registrationSection");

 show("loginSection");

};


window.addAgent=function(){

 const container=
  el("agentsContainer");

 const index=
  container.children.length;

 const div=
  document.createElement("div");

 div.className="agent-row";

 div.innerHTML=`

  <b>Agent ${index+1}</b>

  <label>Jina</label>

  <input
   class="agent-name"
   placeholder="Jina la Agent">

  <label>PIN</label>

  <input
   class="agent-pin"
   value="${generatePIN()}">

  ${
   index>0
   ?
   `<button
     class="remove"
     onclick="this.parentElement.remove()">
     Ondoa
   </button>`
   :
   `<p class="small">
     Agent wa kwanza:
     <b>NIMETOA tu</b>
   </p>`
  }

 `;

 container.appendChild(div);

};


/* ==============================
 REGISTER
============================== */

window.registerCargo=
async function(){

 const name=
  el("cargoName").value.trim();

 const origin=
  el("origin").value.trim();

 const destination=
  el("destination").value.trim();

 const bossName=
  el("bossName").value.trim();

 const bossPin=
  el("bossPin").value.trim();

 const rows=
  [...document.querySelectorAll(
   ".agent-row"
  )];


 if(
  !name||
  !origin||
  !destination||
  !bossName||
  !bossPin||
  rows.length<1
 ){

  message(
   "registerMessage",
   "Jaza taarifa zote.",
   "error"
  );

  return;

 }


 const agents=[];


 rows.forEach((row,i)=>{

  agents.push({

   order:i+1,

   agentName:
    row.querySelector(
     ".agent-name"
    ).value.trim(),

   pin:
    row.querySelector(
     ".agent-pin"
    ).value.trim()

  });

 });


 if(
  agents.some(
   a=>!a.agentName||!a.pin
  )
 ){

  message(
   "registerMessage",
   "Jaza jina na PIN ya kila agent.",
   "error"
  );

  return;

 }


 const tracking=
  generateTracking();

 const created=
  now();

 const stages={};


 agents.forEach(
  (agent,i)=>{

   stages[
    "stage_"+(i+1)
   ]={

    order:i+1,

    agentName:
     agent.agentName,

    pin:
     agent.pin,

    role:
     i===0
     ?"FIRST"
     :"NORMAL",

    status:
     i===0
     ?"READY_TO_RELEASE"
     :"WAITING",

    receivedAt:null,

    receivedLocation:null,

    locationName:null,

    releasedAt:null,

    releasedLocation:null,

    releasedLocationName:null

   };

  }
 );


 const historyKey=
  push(
   ref(
    db,
    `cargo/${tracking}/history`
   )
  ).key;


 const cargo={

  name,

  origin,

  destination,

  bossName,

  bossPin,

  tracking,

  status:"READY_TO_RELEASE",

  createdAt:created,

  updatedAt:created,

  stages,

  bossReceivedAt:null,

  bossReceivedLocation:null,

  bossReceivedLocationName:null,

  history:{

   [historyKey]:{

    action:"REGISTERED",

    description:
     "Mzigo umesajiliwa",

    time:created

   }

  }

 };


 try{

  await set(
   ref(
    db,
    "cargo/"+tracking
   ),
   cargo
  );


  const pins=
   agents.map(
    (a,i)=>
     `Agent ${i+1}: <b>${escapeHTML(
      a.agentName
     )}</b> — PIN: <b>${a.pin}</b>`
   )
   .join("<br>");


  message(
   "registerMessage",

   `
   <b>✅ MZIGO UMEANZISHWA</b><br><br>

   <b>Tracking ID:</b>
   ${tracking}<br><br>

   <b>Boss PIN:</b>
   ${bossPin}<br><br>

   <b>PIN za Agents:</b><br>
   ${pins}

   <br><br>
   Hifadhi taarifa hizi.
   `,

   "success"
  );


 }catch(error){

  console.error(error);

  message(
   "registerMessage",
   error.message,
   "error"
  );

 }

};


/* ==============================
 AGENT LOGIN
============================== */

window.loginAgent=
async function(){

 const tracking=
  el("loginTracking")
  .value
  .trim()
  .toUpperCase();

 const pin=
  el("loginPin")
  .value
  .trim();


 if(!tracking||!pin){

  message(
   "loginMessage",
   "Weka Tracking ID na PIN.",
   "error"
  );

  return;

 }


 const snapshot=
  await get(
   ref(
    db,
    "cargo/"+tracking
   )
  );


 if(!snapshot.exists()){

  message(
   "loginMessage",
   "Mzigo haujapatikana.",
   "error"
  );

  return;

 }


 const cargo=
  snapshot.val();

 let found=null;


 Object.entries(
  cargo.stages||{}
 )
 .forEach(
  ([key,stage])=>{

   if(stage.pin===pin){

    found={
     key,
     stage
    };

   }

  }
 );


 if(!found){

  message(
   "loginMessage",
   "PIN si sahihi.",
   "error"
  );

  return;

 }


 currentTracking=tracking;

 currentStageIndex=
  found.stage.order;

 currentMode="agent";


 hide("loginSection");

 hide("registrationSection");

 hide("bossSection");

 show("agentSection");


 renderAgent(
  cargo,
  found.key
 );


 if(cargoListener)
  cargoListener();


 cargoListener=
  onValue(
   ref(
    db,
    "cargo/"+tracking
   ),
   snap=>{

    if(
     snap.exists()
    ){

     renderAgent(
      snap.val(),
      found.key
     );

    }

   }
  );

};


/* ==============================
 AGENT RENDER
============================== */

function renderAgent(
 cargo,
 stageKey
){

 const stage=
  cargo.stages[stageKey];


 el("agentCargoInfo").innerHTML=`

  <div class="info-row">
   <span>Mzigo</span>
   <b>${escapeHTML(
    cargo.name
   )}</b>
  </div>

  <div class="info-row">
   <span>Tracking</span>
   <b>${escapeHTML(
    cargo.tracking
   )}</b>
  </div>

  <div class="info-row">
   <span>Safari</span>
   <b>
    ${escapeHTML(cargo.origin)}
    →
    ${escapeHTML(cargo.destination)}
   </b>
  </div>

 `;


 let html="";


 /* =========================
    AGENT 1
 ========================= */

 if(stage.order===1){

  html+=`

   <div class="message">
    👤 Wewe ni <b>Agent wa kwanza</b>.<br>
    Una jukumu la kuonyesha
    kwamba mzigo umetoka.
   </div>

  `;


  if(stage.releasedAt){

   html+=`

    <div class="message success">

     ✓ <b>NIMETOA</b><br>

     📍 ${escapeHTML(
      stage.releasedLocationName||
      "Eneo"
     )}<br>

     🕐 ${formatTime(
      stage.releasedAt
     )}

    </div>

   `;

  }else{

   html+=`

    <button
     class="release"
     onclick="releaseCargo()">

     ✓ NIMETOA MZIGO

    </button>

   `;

  }


  /*
    Agent 1 anaona taarifa zote
  */

  show(
   "agentFullInfoCard"
  );


  renderFullStages(
   cargo
  );

 }else{

  hide(
   "agentFullInfoCard"
  );


  /*
    Agent wa kawaida
  */

  if(stage.receivedAt){

   html+=`

    <div class="message success">

     ✓ <b>NIMEPOKEA</b><br>

     📍 ${escapeHTML(
      stage.locationName||
      "Eneo"
     )}<br>

     🕐 ${formatTime(
      stage.receivedAt
     )}

    </div>

   `;

  }else if(
   stage.status==="READY_TO_RECEIVE"
  ){

   html+=`

    <button
     class="receive"
     onclick="receiveCargo()">

     ✓ NIMEPOKEA MZIGO

    </button>

   `;

  }else{

   html+=`

    <div class="message">

     ⏳ NASUBIRI MZIGO<br>
     Agent aliyeko nyuma yako
     bado hajatoa.

    </div>

   `;

  }


  if(
   stage.receivedAt &&
   !stage.releasedAt
  ){

   html+=`

    <button
     class="release"
     onclick="releaseCargo()">

     ✓ NIMETOA MZIGO

    </button>

   `;

  }


  if(stage.releasedAt){

   html+=`

    <div class="message success">

     ✓ <b>NIMETOA</b><br>

     📍 ${escapeHTML(
      stage.releasedLocationName||
      "Eneo"
     )}<br>

     🕐 ${formatTime(
      stage.releasedAt
     )}

    </div>

   `;

  }

 }


 el("agentStage").innerHTML=
  html;


 setTimeout(()=>{

  if(!agentMap){

   agentMap=
    createMap(
     "agentMap"
    );

  }

  agentMap.invalidateSize();

  /*
    Agent 1 anaona ramani yote.
    Agent wengine pia wanaona ramani,
    lakini hapa UI inaweza kubadilishwa
    kulingana na permission ya mwisho.
  */

  drawMap(
   agentMap,
   cargo

/* ==============================
 FULL STAGES
============================== */

function renderFullStages(cargo){

 const stages=
  Object.values(
   cargo.stages||{}
  )
  .sort(
   (a,b)=>
    (a.order||0)-(b.order||0)
  );


 let html="";


 stages.forEach(stage=>{

  let status=
   "NASUBIRI";

  let cls="waiting";


  if(stage.releasedAt){

   status="IMETOLEWA";
   cls="released";

  }else if(stage.receivedAt){

   status="IMEPOKELEWA";
   cls="received";

  }else if(
   stage.status==="READY_TO_RECEIVE"||
   stage.status==="READY_TO_RELEASE"
  ){

   status="TAYARI";
   cls="ready";

  }


  html+=`

   <div class="stage ${cls}">

    <div class="stage-head">

     <h3>
      ${stage.order}.
      ${escapeHTML(
       stage.agentName
      )}
     </h3>

     <span
      class="badge ${cls}">
      ${status}
     </span>

    </div>


    ${
     stage.receivedAt
     ?
     `
     <div class="message success">

      ✓ NIMEPOKEA<br>

      📍 ${escapeHTML(
       stage.locationName||"Eneo"
      )}<br>

      🕐 ${formatTime(
       stage.receivedAt
      )}

     </div>
     `
     :
     stage.order>1
     ?
     `
     <div class="message">
      ☐ NIMEPOKEA — bado
     </div>
     `
     :
     ""
    }


    ${
     stage.releasedAt
     ?
     `
     <div class="message success">

      ✓ NIMETOA<br>

      📍 ${escapeHTML(
       stage.releasedLocationName||
       "Eneo"
      )}<br>

      🕐 ${formatTime(
       stage.releasedAt
      )}

     </div>
     `
     :
     `
     <div class="message">
      ☐ NIMETOA — bado
     </div>
     `
    }

   </div>

  `;

 });


 html+=`

  <div class="stage">

   <h3>👑 BOSS</h3>

   ${
    cargo.bossReceivedAt
    ?
    `
    <div class="message success">

     ✓ BOSS AMEPOKEA<br>

     📍 ${escapeHTML(
      cargo.bossReceivedLocationName||
      "Eneo"
     )}<br>

     🕐 ${formatTime(
      cargo.bossReceivedAt
     )}

    </div>
    `
    :
    `
    <div class="message">
     ☐ BOSS — bado
    </div>
    `
   }

  </div>

 `;


 el("agentFullStages").innerHTML=
  html;

}


/* ==============================
 RECEIVE
============================== */

window.receiveCargo=
async function(){

 const snap=
  await get(
   ref(
    db,
    "cargo/"+currentTracking
   )
  );


 if(!snap.exists())
  return;


 const cargo=
  snap.val();

 const key=
  "stage_"+currentStageIndex;

 const stage=
  cargo.stages[key];


 if(!stage)
  return;


 if(stage.order===1){

  alert(
   "Agent wa kwanza hapokei."
  );

  return;

 }


 const previous=
  cargo.stages[
   "stage_"+(stage.order-1)
  ];


 if(
  !previous||
  !previous.releasedAt
 ){

  alert(
   "Bado hujaruhusiwa kupokea."
  );

  return;

 }


 if(stage.receivedAt){

  alert(
   "Tayari umepokea."
  );

  return;

 }


 const gps=
  await getGPS();


 let place=
  "Eneo halijapatikana";


 if(gps){

  place=
   await locationName(
    gps.lat,
    gps.lng
   );

 }


 const time=
  now();


 const updates={};


 updates[
  `cargo/${currentTracking}/stages/${key}/receivedAt`
 ]=time;


 updates[
  `cargo/${currentTracking}/stages/${key}/receivedLocation`
 ]=gps;


 updates[
  `cargo/${currentTracking}/stages/${key}/locationName`
 ]=place;


 updates[
  `cargo/${currentTracking}/stages/${key}/status`
 ]="RECEIVED";


 updates[
  `cargo/${currentTracking}/updatedAt`
 ]=time;


 const historyKey=
  push(
   ref(
    db,
    `cargo/${currentTracking}/history`
   )
  ).key;


 updates[
  `cargo/${currentTracking}/history/${historyKey}`
 ]={

  action:"RECEIVED",

  stage:stage.order,

  agentName:
   stage.agentName,

  description:
   `${stage.agentName} amepokea mzigo`,

  locationName:place,

  location:gps,

  time

 };


 await update(
  ref(db),
  updates
 );


 alert(
  "✅ NIMEPOKEA imerekodiwa."
 );

};

window.releaseCargo=
async function(){

 const snap=
  await get(
   ref(
    db,
    "cargo/"+currentTracking
   )
  );


 if(!snap.exists())
  return;


 const cargo=
  snap.val();

 const key=
  "stage_"+currentStageIndex;

 const stage=
  cargo.stages[key];


 if(!stage)
  return;


 if(
  stage.order>1 &&
  !stage.receivedAt
 ){

  alert(
   "Kwanza bonyeza NIMEPOKEA."
  );

  return;

 }


 if(stage.releasedAt){

  alert(
   "Tayari umetoa."
  );

  return;

 }


 const gps=
  await getGPS();


 let place=
  "Eneo halijapatikana";


 if(gps){

  place=
   await locationName(
    gps.lat,
    gps.lng
   );

 }


 const time=
  now();


 const updates={};


 updates[
  `cargo/${currentTracking}/stages/${key}/releasedAt`
 ]=time;


 updates[
  `cargo/${currentTracking}/stages/${key}/releasedLocation`
 ]=gps;


 updates[
  `cargo/${currentTracking}/stages/${key}/releasedLocationName`
 ]=place;


 updates[
  `cargo/${currentTracking}/stages/${key}/status`
 ]="RELEASED";


 updates[
  `cargo/${currentTracking}/updatedAt`
 ]=time;


 const nextKey=
  "stage_"+(stage.order+1);

 const next=
  cargo.stages[nextKey];


 if(next){

  updates[
   `cargo/${currentTracking}/stages/${nextKey}/status`
  ]="READY_TO_RECEIVE";

 }else{

  updates[
   `cargo/${currentTracking}/status`
  ]="WAITING_FOR_BOSS";

 }


 const historyKey=
  push(
   ref(
    db,
    `cargo/${currentTracking}/history`
   )
  ).key;


 updates[
  `cargo/${currentTracking}/history/${historyKey}`
 ]={

  action:"RELEASED",

  stage:stage.order,

  agentName:
   stage.agentName,

  description:
   `${stage.agentName} ametoa mzigo`,

  locationName:place,

  location:gps,

  time

 };


 await update(
  ref(db),
  updates
 );


 alert(
  "✅ NIMETOA imerekodiwa."
 );

};

window.loginBoss=
async function(){

 const tracking=
  el("loginTracking")
  .value
  .trim()
  .toUpperCase();

 const pin=
  el("loginPin")
  .value
  .trim();


 if(!tracking||!pin){

  message(
   "loginMessage",
   "Weka Tracking ID na PIN.",
   "error"
  );

  return;

 }


 const snap=
  await get(
   ref(
    db,
    "cargo/"+tracking
   )
  );


 if(!snap.exists()){

  message(
   "loginMessage",
   "Mzigo haujapatikana.",
   "error"
  );

  return;

 }


 const cargo=
  snap.val();


 if(cargo.bossPin!==pin){

  message(
   "loginMessage",
   "PIN ya Boss si sahihi.",
   "error"
  );

  return;

 }


 currentTracking=tracking;

 currentMode="boss";


 hide("loginSection");

 hide("registrationSection");

 hide("agentSection");

 show("bossSection");


 renderBoss(cargo);


 if(cargoListener)
  cargoListener();


 cargoListener=
  onValue(
   ref(
    db,
    "cargo/"+tracking
   ),
   snap=>{

    if(snap.exists()){

     renderBoss(
      snap.val()
     );

    }

   }
  );

};


/* ==============================
 BOSS VIEW
============================== */

function renderBoss(cargo){

 el("bossCargoInfo").innerHTML=`

  <div class="info-row">
   <span>Mzigo</span>
   <b>${escapeHTML(
    cargo.name
   )}</b>
  </div>

  <div class="info-row">
   <span>Tracking</span>
   <b>${escapeHTML(
    cargo.tracking
   )}</b>
  </div>

  <div class="info-row">
   <span>Kuanzia</span>
   <b>${escapeHTML(
    cargo.origin
   )}</b>
  </div>

  <div class="info-row">
   <span>Destination</span>
   <b>${escapeHTML(
    cargo.destination
   )}</b>
  </div>

  <div class="info-row">
   <span>Boss</span>
   <b>${escapeHTML(
    cargo.bossName
   )}</b>
  </div>

 `;


 renderFullStages(
  cargo
 );


 /*
  Boss anaweza kupokea tu
  baada ya agent wa mwisho kutoa.
 */

 const stages=
  Object.values(
   cargo.stages||{}
  )
  .sort(
   (a,b)=>
    (a.order||0)-(b.order||0)
  );


 const last=
  stages[stages.length-1];


 let bossButton="";


 if(cargo.bossReceivedAt){

  bossButton=`

   <div class="message success">

    ✓ <b>BOSS AMEPOKEA</b><br>

    📍 ${escapeHTML(
     cargo.bossReceivedLocationName||
     "Eneo"
    )}<br>

    🕐 ${formatTime(
     cargo.bossReceivedAt
    )}

   </div>

  `;

 }else if(
  last &&
  last.releasedAt
 ){

  bossButton=`

   <button
    class="receive"
    onclick="bossReceive()">

    ✓ BOSS NIMEPOKEA MZIGO

   </button>

  `;

 }else{

  bossButton=`

   <div class="message">

    ⏳ Boss bado anasubiri mzigo.

   </div>

  `;

 }


 /*
  Boss block
 */

 el("transportStages").innerHTML+=`

  <div class="stage">

   <h3>👑 BOSS</h3>

   ${bossButton}

  </div>

 `;


 /*
  History
 */

 const history=
  Object.values(
   cargo.history||{}
  )
  .sort(
   (a,b)=>
    new Date(a.time)-
    new Date(b.time)
  );


 if(!history.length){

  el("history").innerHTML=
   "Hakuna historia.";

 }else{

  el("history").innerHTML=
   history.map(h=>`

    <div class="timeline-item">

     <b>
      ${escapeHTML(
       h.description||h.action
      )}
     </b>

     <div class="small">
      🕐 ${formatTime(h.time)}
     </div>

     ${
      h.locationName
      ?
      `
      <div class="small">
       📍 ${escapeHTML(
        h.locationName
       )}
      </div>
      `
      :
      ""
     }

    </div>

   `).join("");

 }


 /*
  Map
 */

 setTimeout(()=>{

  if(!bossMap){

   bossMap=
    createMap(
     "bossMap"
    );

  }

  bossMap.invalidateSize();

  drawMap(
   bossMap,
   cargo
  );

 },150);

}
