        // PLAYER FUNCTIONS
        function playAudio(key, link, mediaName, mediaImage) {

        function addViewAndDownload(key, link, fileName) {

        // ==========================================
        // 3RD PARTY DOWNLOAD API (Loader.to / Free API)
        // Hii haiitaji tena Render Server, inajitegemea!
        // ==========================================
        async function downloadWithCustomAPI(videoId, type) {
            var noti = document.getElementById('download-noti');
            var notiText = document.getElementById('noti-text');
            var notiBar = document.getElementById('noti-bar');
            
            noti.style.display = 'block';
            notiBar.style.width = '10%';
            notiText.innerText = `Connecting to Server... 10% ⏳`;

            // Chagua format (mp3 au mp4)
            let format = type === 'audio' ? 'mp3' : 'mp4';
            let youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`;

            try {
                // Hatua ya 1: Tuma ombi kwenye 3rd Party API kuanza kuchakata faili
                let initUrl = `https://loader.to/ajax/download.php?format=${format}&url=${encodeURIComponent(youtubeUrl)}`;
                let initResponse = await fetch(initUrl);
                let initData = await initResponse.json();

                if (!initData.success) {
                    throw new Error("API imegoma kuanzisha process");
                }

                let taskId = initData.id;

                // Hatua ya 2: Kufuatilia asilimia kiukweli (Polling)
                let checkProgress = setInterval(async () => {
                    try {
                        let progressUrl = `https://loader.to/ajax/progress.php?id=${taskId}`;
                        let progResponse = await fetch(progressUrl);
                        let progData = await progResponse.json();

                        if (progData.success) {
                            let currentProgress = progData.progress; // Inasoma kiukweli toka 0 mpaka 100
                            notiText.innerText = `Extracting ${type.toUpperCase()} File... ${currentProgress}% ⏳`;
                            notiBar.style.width = `${currentProgress}%`;

                            // Ikishafika 1000 au 100 inamaanisha faili lipo tayari
                            if (progData.download_url) {
                                clearInterval(checkProgress); // Simamisha kuangalia
                                notiBar.style.width = '100%';
                                notiText.innerText = "File Ready! Downloading... 100% ✅";
                                
                                setTimeout(() => {
                                    noti.style.display = 'none';
                                    window.open(progData.download_url, '_blank'); // Fungua faili!
                                }, 1500);
                            }
                        }
                    } catch (e) {
                        console.log("Subiri kidogo...");
                    }
                }, 2500); // Inakagua maendeleo kila baada ya sekunde 2.5

            } catch (error) {
                console.error("Download Error:", error);
                noti.style.display = 'none';
                alert("Server busy au faili lina ulinzi mkali. Tafadhali jaribu wimbo mwingine.");
            }
        }

        // ==========================================
        // YOUTUBE SEARCH
        // ==========================================
        var YOUTUBE_API_KEY = "AIzaSyBmIm_fKvgiZ34N36EtKl-28G0C3c_0d1I"; 

        async function searchGlobalMedia() {
            var query = document.getElementById("search-input").value.trim();
            if (query === "") return;

            var mainNode = document.getElementById("media-list");
            var relatedTitle = document.getElementById("related-title");
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

            relatedTitle.innerHTML = "🌍 Global Search Results...";
            mainNode.innerHTML = "<p style='text-align:center; color:#00e676; font-size: 14px; padding: 20px;'>Searching at 5G speed... ⚡</p>";

            try {
                let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
                let response = await fetch(url);
                if (!response.ok) throw new Error("API Issue");
                let data = await response.json();
                mainNode.innerHTML = ""; 

                if (!data.items || data.items.length === 0) {
                    mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>We couldn't find any results.</p>";
                    return;
                }

                data.items.forEach(item => {
                    let videoId = item.id.videoId;
                    if (!videoId) return; 
                    let title = item.snippet.title.replace(/&quot;/g, '"').replace(/&#39;/g, "'");
                    let thumb = item.snippet.thumbnails?.high?.url || "https://via.placeholder.com/300";
                    let safePlayName = title.replace(/'/g, "\\'");

                    let card = `
                        <div class="media-card">
                            <img src="${thumb}" onclick="watchYouTubeOnline('${videoId}', '${safePlayName}')" style="cursor:pointer;">
                            <div class="media-details">
                                <div class="badge-container">
                                    <span class="badge badge-global">🌍 STREAM & DOWNLOAD</span>
                                </div>
                                <div class="media-title">${title}</div>
                                <div class="btn-container">
                                    <div class="media-actions" style="margin-bottom: 5px;">
                                        <button class="btn-action btn-play-video" onclick="watchYouTubeOnline('${videoId}', '${safePlayName}')">▶️ WATCH ONLINE</button>
                                    </div>
                                    <div class="media-actions">
                                        <button class="btn-action btn-dl-audio" onclick="downloadWithCustomAPI('${videoId}', 'audio')">🎧 Download MP3</button>
                                        <button class="btn-action btn-dl-video" onclick="downloadWithCustomAPI('${videoId}', 'video')">🎬 Download MP4</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    mainNode.innerHTML += card;
                });

            } catch (error) {
                mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>A network error occurred. Please check your YouTube API key.</p>";
            }
        }

        // LOAD NORMAL DATABASE MEDIA
        function loadMedia() {
            document.getElementById("loading").style.display = "block";
            database.ref('media').on('value', function(snapshot) {
                document.getElementById("loading").style.display = "none";
                allFetchedMedia = [];
                if (!snapshot.exists()) return;
                snapshot.forEach(function(childSnapshot) {
                    allFetchedMedia.push({ key: childSnapshot.key, data: childSnapshot.val() });
                });
                allFetchedMedia.reverse(); 
                filterMedia('all');
            });
        }

        function createCard(data, key) {
            var mediaImage = data.picha || "https://via.placeholder.com/300x180/252530/aaa?text=MAKYAMA+MEDIA";
            var audioLink = data.linkAudio;
            var videoLink = data.linkVideo;
            var safePlayName = data.jina.replace(/'/g, "\\'");
            var safePlayImage = mediaImage.replace(/'/g, "\\'");

            var btnAudioHTML = audioLink ? `
                <div class="media-actions">
                    <button class="btn-action btn-play-audio" onclick="playAudio('${key}', '${audioLink}', '${safePlayName}', '${safePlayImage}')">▶️ Play</button>
                    <button class="btn-action btn-dl-audio" onclick="addViewAndDownload('${key}', '${audioLink}')">⬇️ Download</button>
                </div>` : "";
            var btnVideoHTML = videoLink ? `
                <div class="media-actions">
                    <button class="btn-action btn-play-video" onclick="window.open('${videoLink}', '_blank')">▶️ Video</button>
                    <button class="btn-action btn-dl-video" onclick="addViewAndDownload('${key}', '${videoLink}')">⬇️ Download</button>
                </div>` : "";

            return `
                <div class="media-card">
                    <img src="${mediaImage}" loading="lazy" style="cursor:pointer;">
                    <div class="media-details">
                        <div class="badge-container">
                            ${audioLink ? '<span class="badge">AUDIO</span>' : ''}
                            ${videoLink ? '<span class="badge badge-video">VIDEO</span>' : ''}
                        </div>
                        <div class="media-title">${data.jina}</div>
                        <div class="btn-container">${btnAudioHTML}${btnVideoHTML}</div>
                        <div class="reaction-bar">
                            <button class="reaction-item">👁️ ${data.views || 0}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterMedia(category, btnElement) {
            document.getElementById("search-input").value = "";
            if(btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            var mainNode = document.getElementById("media-list");
            mainNode.innerHTML = "";
            var filteredData = [...allFetchedMedia];

            if (category === 'music') { filteredData = filteredData.filter(item => item.data.linkAudio); } 
            else if (category === 'videos') { filteredData = filteredData.filter(item => item.data.linkVideo); }
            
            if(filteredData.length === 0) { mainNode.innerHTML = "<p style='color:#aaa; text-align:center;'>No media available.</p>"; return; }
            filteredData.forEach(function(item) { mainNode.innerHTML += createCard(item.data, item.key); });
        }

        window.onload = function() { loadMedia(); };
    </script>
</body>
</html>
