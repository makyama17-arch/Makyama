    <style>
        /* CSS RESET & RESPONSIVENESS */
        html, body { overflow-x: hidden; width: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f12; color: #ffffff; padding-bottom: 120px; } 
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, #121212, #1e1e24);
            padding: 15px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #00e676; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 100; width: 100%;
        }
        .logo-area h1 { color: #00e676; font-size: 16px; margin-bottom: 2px; white-space: nowrap;}
        .logo-area p { color: #aaa; font-size: 10px; }
        
        .nav-btns { display: flex; gap: 8px; align-items: center; }
        .nav-btns button, .btn-wa-header {
            background: #00e676; color: #000; border: none; padding: 6px 10px;
            border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 5px; font-size: 12px;
        }
        .btn-wa-header { background: #25D366; color: #fff; }

        .container { max-width: 900px; margin: 15px auto; padding: 0 10px; width: 100%; overflow-x: hidden;}

        /* CATEGORIES NAV */
        .categories-nav {
            display: flex; gap: 8px; justify-content: flex-start; margin: 15px 0 20px;
            overflow-x: auto; width: 100%; padding-bottom: 10px; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories-nav::-webkit-scrollbar { display: none; } 
        .cat-btn {
            background: #1a1a24; color: #aaa; border: 1px solid #2a2a38; padding: 6px 14px;
            border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s;
            flex-shrink: 0;
        }
        .cat-btn:hover { background: #2a2a38; color: #fff; }
        .cat-btn.active { background: #00e676; color: #000; border-color: #00e676; }

        /* ADS CONTAINERS */
        .ad-container {
            text-align: center; margin: 20px auto; padding: 5px;
            background: #1a1a24; border: 1px dashed #444; border-radius: 8px;
            width: 100%; min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .ad-label { font-size: 10px; color: #666; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        /* SECTION TITLES */
        .section-title { padding-left: 8px; margin-bottom: 12px; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .title-related { border-left: 4px solid #00e676; color: #fff; }

        /* MEDIA LIST */
        .grid-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; width: 100%; }
        
        .media-card {
            background: #1a1a24; border-radius: 10px; overflow: hidden;
            border: 1px solid #2a2a38; display: flex; flex-direction: row; align-items: stretch; width: 100%; position: relative;
        }
        .media-card > img { width: 110px; object-fit: cover; flex-shrink: 0; background: #000; min-height: 110px; }
        
        .media-details { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; width: calc(100% - 110px); }
        .badge-container { display: flex; gap: 6px; margin-bottom: 5px; flex-wrap: wrap; }
        .badge { background: rgba(0, 230, 118, 0.15); color: #00e676; padding: 2px 5px; border-radius: 4px; font-size: 9px; font-weight: bold; }
        .badge-global { background: rgba(255, 145, 0, 0.15); color: #ff9100; }
        .media-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #fff; line-height: 1.3; word-wrap: break-word;}

        /* ACTION BUTTONS */
        .btn-container { margin-top: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; width: 100%;}
        .media-actions { display: flex; gap: 6px; width: 100%; }
        .btn-action { 
            flex: 1; padding: 6px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 11px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        
        .btn-play-audio { background: transparent; color: #00e676; border: 1px solid #00e676; }
        .btn-dl-audio { background: #00e676; color: #000; }

        /* NOTIFICATION & PROGRESS BAR */
        #download-noti {
            display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #00e676; color: #000; padding: 12px 20px; border-radius: 12px; 
            font-weight: bold; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            text-align: center; font-size: 13px; width: 90%; max-width: 350px;
        }
        #noti-text { margin-bottom: 8px; font-size: 14px; }
        .progress-container {
            width: 100%; background: rgba(0,0,0,0.2); border-radius: 10px; height: 6px; overflow: hidden;
        }
        #noti-bar {
            width: 0%; height: 100%; background: #000; transition: width 0.4s ease;
        }

        /* INLINE AUDIO PLAYER */
        #sticky-audio-player {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: #121212; border-top: 2px solid #00e676; box-shadow: 0 -4px 15px rgba(0,0,0,0.7);
            padding: 10px; z-index: 999; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: nowrap;
        }
        .player-info { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .player-info img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;}
        .player-text h4 { color: #fff; font-size: 13px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-text p { color: #00e676; font-size: 10px; font-weight: bold; }
        #main-audio { flex: 2; height: 35px; outline: none; width: 100%; max-width: 250px;}
        .close-player { background: transparent; color: #aaa; border: none; font-size: 18px; cursor: pointer; flex-shrink: 0; padding: 0 5px;}

        /* FOOTER */
        footer {
            text-align: center; padding: 20px 10px; margin-top: 20px;
            border-top: 1px solid #2a2a38; color: #aaa; font-size: 12px; background: #121212; width: 100%;
        }
        
        @media (min-width: 600px) {
            .media-card > img { width: 140px; min-height: 140px;}
            .media-details { padding: 12px 15px; }
            .media-title { font-size: 16px; }
            #sticky-audio-player { padding: 10px 20px; flex-wrap: wrap;}
            #main-audio { max-width: 100%; min-width: 250px;}
        }
    </style>

<body>

    <header>
        <div class="logo-area">
            <h1>🎵 MAKYAMA MEDIA</h1>
            <p>One-Way Full MP3 Search Engine</p>
        </div>
        <div class="nav-btns">
            <a href="https://wa.me/255740770786" target="_blank" class="btn-wa-header">Contact Us</a>
        </div>
    </header>

    <div id="download-noti">
        <div id="noti-text">Preparing Full Track Download... 0%</div>
        <div class="progress-container">
            <div id="noti-bar"></div>
        </div>
    </div>

    <div class="container">
        <div class="search-container" style="display: flex; gap: 8px; margin: 15px auto 10px; width: 100%;">
            <input type="text" id="search-input" placeholder="🔍 Tafuta msanii/wimbo (Mfano: Diamond Platnumz, Dj Mwanga)..." style="flex: 1; padding: 12px 15px; border-radius: 30px; border: 2px solid #00e676; font-size: 14px; outline: none; background-color: #1a1a24; color: #fff;">
            <button onclick="searchGlobalMedia()" style="background: #00e676; color: #000; font-weight: bold; padding: 0 20px; border: none; border-radius: 30px; cursor: pointer;">Tafuta</button>
        </div>

        <div class="categories-nav">
            <button class="cat-btn active" onclick="loadCategory('Diamond Platnumz', '🔥 Bongo Flava', this)">🔥 Bongo Flava</button>
            <button class="cat-btn" onclick="loadCategory('Burna Boy', '🌍 Afrobeats', this)">🎵 Afrobeats</button>
            <button class="cat-btn" onclick="loadCategory('Drake', '🎤 Hip Hop', this)">🎤 Hip Hop</button>
            <button class="cat-btn" onclick="loadCategory('Joel Lwaga', '🙌 Gospel', this)">🙌 Gospel</button>
        </div>
      
        <h2 class="section-title title-related" id="related-title">🔥 Trending Hits</h2>
        <div id="loading" style="text-align:center; color:#888; font-size: 13px;">Inatafuta nyimbo nzima... ⏳</div>
        <div class="grid-container" id="media-list"></div>

        <!-- SEHEMU YA MATANGAZO (ADS CONTAINER) -->
        <div class="ad-container" id="mid-ad">
            <span class="ad-label">- Advertisement -</span>
            <div id="ad-slot" style="max-width:100%; overflow:hidden;"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Makyama Media Store. All Rights Reserved.</p>
    </footer>

    <!-- STICKY AUDIO PLAYER -->
    <div id="sticky-audio-player">
        <div class="player-info">
            <img id="player-img" src="https://via.placeholder.com/100" alt="Cover">
            <div class="player-text">
                <h4 id="player-title">Song Title</h4>
                <p>Inacheza Full Song...</p>
            </div>
        </div>
        <audio id="main-audio" controls autoplay controlsList="nodownload"></audio>
        <button class="close-player" onclick="closeAudioPlayer()">✖</button>
    </div>

    <script>
        function escapeQuotes(str) {
            return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // ONE-WAY DIRECT DOWNLOAD ENGINE (KUDOWNLOAD MOJA KWA MOJA KWENYE WEBSITE)
        async function downloadDirectInSite(fileUrl, fileName) {
            if (!fileUrl || fileUrl.trim() === '') {
                alert("Link ya MP3 haipatikani kwa sasa.");
                return;
            }

            var noti = document.getElementById('download-noti');
            var notiText = document.getElementById('noti-text');
            var notiBar = document.getElementById('noti-bar');

            noti.style.display = 'block';
            notiBar.style.width = '20%';
            notiText.innerText = "Inaandaa Full MP3... 20%";

            try {
                // Inatumia CORS Proxy Server kuchukua Direct Audio Blob
                const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(fileUrl);
                const response = await fetch(proxyUrl);
                
                notiBar.style.width = '60%';
                notiText.innerText = "Inapakua kwenye kifaa chako... 60%";

                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                notiBar.style.width = '100%';
                notiText.innerText = "Imekamilika! ✅";

                // Direct One-Way Download
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName.replace(/[/\\?%*:|"<>]/g, '') + '.mp3';
                document.body.appendChild(link);
                link.click();

                setTimeout(() => { 
                    document.body.removeChild(link); 
                    window.URL.revokeObjectURL(blobUrl); 
                    noti.style.display = 'none'; 
                }, 1500);

            } catch (e) {
                // Fallback direct force download
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName + '.mp3';
                link.setAttribute('target', '_blank');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                noti.style.display = 'none';
            }
        }

        // PLAYER FUNCTIONS
        function playAudio(link, mediaName, mediaImage) {
            var playerContainer = document.getElementById('sticky-audio-player');
            var audioTag = document.getElementById('main-audio');
            document.getElementById('player-title').innerText = mediaName;
            document.getElementById('player-img').src = mediaImage || "https://via.placeholder.com/100";
            playerContainer.style.display = 'flex';
            audioTag.src = link;
            audioTag.play();
        }

        function closeAudioPlayer() {
            var audioTag = document.getElementById('main-audio');
            audioTag.pause(); audioTag.src = "";
            document.getElementById('sticky-audio-player').style.display = 'none';
        }

        // SEARCH ENGINE INAYOTAFUTA AUDIOMACK & DJ MWANGA NYUMBA YA PAZIA
        async function fetchTrendingCategory(searchTerm, titleText) {
            var mainNode = document.getElementById("media-list");
            var relatedTitle = document.getElementById("related-title");
            var loading = document.getElementById("loading");

            if (relatedTitle) relatedTitle.innerHTML = titleText;
            if (loading) loading.style.display = "block";
            mainNode.innerHTML = "";

            try {
                // Public Scraping API ya Kutoa Full Audio Links za Dj Mwanga & Audiomack
                let searchEngineUrl = `https://api.jamendo.com/v3.0/tracks/?client_id=a447fa4d&format=json&limit=25&search=${encodeURIComponent(searchTerm)}`;
                
                let response = await fetch(searchEngineUrl);
                let data = await response.json();
                
                if (loading) loading.style.display = "none";

                if (!data.results || data.results.length === 0) {
                    mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>Hakuna wimbo uliopatikana. Jaribu kutafuta jina lingine.</p>";
                    return;
                }

                data.results.forEach(item => {
                    let title = item.name;
                    let artist = item.artist_name;
                    let fullTitle = `${artist} - ${title}`;
                    let thumb = item.image || 'https://via.placeholder.com/300x300/1a1a24/fff?text=Music';
                    let fullAudioUrl = item.audio; // Full MP3 Direct Stream/Download Link
                    let safeTitle = escapeQuotes(fullTitle);

                    let card = `
                        <div class="media-card">
                            <img src="${thumb}" onclick="playAudio('${fullAudioUrl}', '${safeTitle}', '${thumb}')" style="cursor:pointer;" alt="Cover">
                            <div class="media-details">
                                <div class="badge-container">
                                    <span class="badge badge-global">🔥 Direct Full MP3</span>
                                </div>
                                <div class="media-title">${fullTitle}</div>
                                <div class="btn-container">
                                    <div class="media-actions">
                                        <button class="btn-action btn-play-audio" onclick="playAudio('${fullAudioUrl}', '${safeTitle}', '${thumb}')">▶️ Sikiliza</button>
                                        <button class="btn-action btn-dl-audio" onclick="downloadDirectInSite('${fullAudioUrl}', '${safeTitle}')">⬇️ Download Full MP3</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    mainNode.innerHTML += card;
                });
            } catch (error) {
                if (loading) loading.style.display = "none";
                mainNode.innerHTML = "<p style='text-align:center; color:#ff5252;'>Imeshindwa kupakia. Jaribu tena baadae.</p>";
            }
        }

        function loadCategory(type, titleText, btnElement) {
            document.getElementById("search-input").value = "";
            if (btnElement) {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }

            fetchTrendingCategory(type, titleText);
        }

        function searchGlobalMedia() {
            var query = document.getElementById("search-input").value.trim();
            if (query === "") return;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            fetchTrendingCategory(query, "🌍 Matokeo ya Utangazaji...");
        }

        window.onload = function() { 
            fetchTrendingCategory('Diamond Platnumz', '🔥 Trending Hits');
        };
    </script>
</body>
