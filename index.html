<!DOCTYPE html>
<html lang="sw">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TPXCRXDVHS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-TPXCRXDVHS');
    </script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Makyama Media Store - Audio & Music</title>

    <style>
        /* CSS RESET & RESPONSIVENESS (Kutoka kwenye code zako) */
        html, body { overflow-x: hidden; width: 100%; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0f0f12; color: #ffffff; padding-bottom: 50px; } 
        
        /* HEADER */
        header {
            background: linear-gradient(135deg, #121212, #1e1e24);
            padding: 15px 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 3px solid #00e676; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: sticky; top: 0; z-index: 100; width: 100%;
        }
        .logo-area h1 { color: #00e676; font-size: 18px; margin-bottom: 2px; white-space: nowrap; font-weight: 900;}
        .logo-area p { color: #aaa; font-size: 11px; }
        
        .nav-btns { display: flex; gap: 8px; align-items: center; }
        .btn-wa-header {
            background: #25D366; color: #fff; border: none; padding: 8px 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none;
            display: flex; align-items: center; gap: 5px; font-size: 12px;
        }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; width: 100%; }

        /* SEARCH BAR YAKO MPYA */
        .search-box {
            display: flex; gap: 10px; margin-bottom: 25px;
        }
        .search-box input {
            flex: 1; padding: 12px 15px; background: #252530;
            border: 1px solid #3a3a4c; color: #fff; border-radius: 8px; outline: none; font-size: 15px;
        }
        .search-box input:focus { border-color: #00e676; }
        .search-box button {
            background: #00e676; color: #000; font-weight: bold; padding: 12px 20px;
            border: none; border-radius: 8px; cursor: pointer; font-size: 15px;
        }

        /* STATUS MESSAGE */
        .status-message {
            text-align: center; color: #ffeb3b; font-weight: bold; margin-bottom: 15px; font-size: 14px;
        }

        /* MEDIA LIST (Muonekano wako mpya wa kadi) */
        .grid-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; width: 100%; }
        
        .media-card {
            background: #1a1a24; border-radius: 12px; overflow: hidden;
            border: 1px solid #2a2a38; display: flex; flex-direction: row; align-items: stretch; width: 100%;
        }
        .media-card > img { width: 130px; object-fit: cover; flex-shrink: 0; background: #000; min-height: 120px; }
        
        .media-details { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; width: calc(100% - 130px); }
        .badge-container { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
        .badge { background: rgba(0, 230, 118, 0.15); color: #00e676; padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-global { background: rgba(255, 145, 0, 0.15); color: #ff9100; }
        .media-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; color: #fff; line-height: 1.4; word-wrap: break-word;}

        /* ACTION BUTTONS */
        .btn-container { margin-top: auto; display: flex; gap: 8px; width: 100%;}
        .btn-action { 
            flex: 1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; font-size: 12px; text-align: center; white-space: nowrap;
        }
        .btn-dl-audio { background: #00e676; color: #000; }
        .btn-dl-video { background: #2196F3; color: #fff; }
        
        /* REACTIONS BAR */
        .reaction-bar { display: flex; gap: 15px; padding-top: 10px; border-top: 1px solid #2a2a38; margin-top: 10px; }
        .reaction-item { color: #aaa; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>MAKYAMA MEDIA</h1>
            <p>Tanzania's #1 Music Store</p>
        </div>
        <div class="nav-btns">
            <a href="https://wa.me/255767568297" class="btn-wa-header" target="_blank">💬 WhatsApp</a>
        </div>
    </header>

    <div class="container">
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tafuta wimbo au msanii hapa...">
            <button onclick="tafutaMzigo()">Tafuta</button>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div id="resultsContainer" class="grid-container">
            </div>

    </div>

    <script>
        // API KEY YAKO IMEWEKWA HAPA TAYARI
        const YOUTUBE_API_KEY = "AIzaSyBe2kQr-75nBWLLE5GDNBvhGFT91FtBbBw"; 

        async function tafutaMzigo() {
            const query = document.getElementById('searchInput').value.trim();
            const status = document.getElementById('statusMessage');
            const container = document.getElementById('resultsContainer');
            
            if (!query) {
                alert("Kiongozi, tafadhali andika jina la wimbo au msanii kwanza!");
                return;
            }
            
            status.innerText = "Inasaka mzigo kikatili... ⏳";
            container.innerHTML = "";

            try {
                const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=15&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    status.innerText = ""; 
                    
                    data.items.forEach(item => {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const channel = item.snippet.channelTitle;
                        const thumb = item.snippet.thumbnails.high.url;

                        // LINK ZA UHAKIKA ZA KUDOWNLOAD
                        const youtubeUrl = `https://www.youtube.com/watch?v=${videoId}`;
                        const mp3DownloadLink = `https://www.y2mate.com/youtube/${videoId}`;
                        const mp4DownloadLink = `https://yt1s.com/en/youtube-to-mp4?q=${encodeURIComponent(youtubeUrl)}`;

                        // Random numbers for fake reactions (Kupamba muonekano)
                        const views = Math.floor(Math.random() * (5000 - 100 + 1)) + 100;
                        const likes = Math.floor(Math.random() * (900 - 50 + 1)) + 50;

                        const card = document.createElement('div');
                        card.className = 'media-card';
                        
                        card.innerHTML = `
                            <img src="${thumb}" alt="Cover">
                            <div class="media-details">
                                <div class="badge-container">
                                    <span class="badge">🔥 New</span>
                                    <span class="badge badge-global">🌍 ${channel}</span>
                                </div>
                                <div class="media-title">${title}</div>
                                
                                <div class="btn-container">
                                    <button class="btn-action btn-dl-audio" onclick="window.open('${mp3DownloadLink}', '_blank')">🎧 Audio</button>
                                    <button class="btn-action btn-dl-video" onclick="window.open('${mp4DownloadLink}', '_blank')">🎬 Video</button>
                                </div>

                                <div class="reaction-bar">
                                    <div class="reaction-item">👁️ ${views}</div>
                                    <div class="reaction-item">❤️ ${likes}</div>
                                    <div class="reaction-item">🔥 Moto</div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    status.innerText = "Hakuna matokeo yaliyopatikana. Jaribu jina jingine.";
                }
            } catch (error) {
                console.error(error);
                status.innerText = "Kuna tatizo la mtandao. Tafadhali jaribu tena.";
            }
        }

        // Ruhusu mteja kubonyeza 'Enter' kusaka
        document.getElementById("searchInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                tafutaMzigo();
            }
        });
    </script>
</body>
</html>
