<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MAKYAMA Dagaa Transport</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=1800&q=80")
    center/cover fixed;
  color:#fff;
  min-height:100vh;
}

header{
  padding:22px 16px;
  text-align:center;
  background:rgba(0,0,0,.55);
  border-bottom:1px solid rgba(255,255,255,.15);
}

.logo{
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#00d9ff;
}

.subtitle{
  margin-top:6px;
  opacity:.8;
  font-size:14px;
}

.container{
  width:min(100%,950px);
  margin:auto;
  padding:20px;
}

.card{
  background:rgba(10,15,25,.88);
  border:1px solid rgba(255,255,255,.12);
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h2,h3{
  margin-top:0;
}

input,select{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
  background:#111827;
  color:white;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:9px;
  border:0;
  border-radius:10px;
  background:#00a8cc;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button.secondary{
  background:#374151;
}

button.danger{
  background:#b91c1c;
}

button.success{
  background:#16803c;
}

.hidden{
  display:none!important;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

.stat{
  background:#111827;
  padding:16px;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.badge{
  display:inline-block;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  background:#374151;
}

.ready{
  background:#15803d;
}

.waiting{
  background:#92400e;
}

.received{
  background:#0369a1;
}

.released{
  background:#6d28d9;
}

.completed{
  background:#15803d;
}

.agent-row{
  padding:14px;
  margin:10px 0;
  background:#111827;
  border-radius:12px;
}

.history{
  border-left:3px solid #00a8cc;
  padding:10px 15px;
  margin:10px 0;
  background:#111827;
  border-radius:8px;
}

.small{
  font-size:12px;
  opacity:.7;
}

.result{
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  background:#111827;
}

.success-box{
  border:1px solid #16a34a;
  background:rgba(22,163,74,.12);
}

.error-box{
  border:1px solid #dc2626;
  background:rgba(220,38,38,.12);
}

.credentials{
  background:#020617;
  padding:15px;
  border-radius:10px;
  overflow:auto;
}

.credential{
  padding:10px;
  border-bottom:1px solid #1f2937;
}

nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:15px;
}

nav button{
  width:auto;
  flex:1;
  min-width:130px;
}

footer{
  text-align:center;
  opacity:.6;
  padding:30px 10px;
  font-size:12px;
}

.location{
  font-size:12px;
  opacity:.75;
  margin-top:6px;
}

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .card{
    padding:15px;
  }

  .logo{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    MAKYAMA <span>DAGAA</span>
  </div>
  <div class="subtitle">
    Dagaa Cargo Transport & Tracking System
  </div>

  <nav>
    <button onclick="showSection('register')">
      Sajili Mzigo
    </button>

    <button onclick="showSection('login')">
      Ingia
    </button>

    <button onclick="showSection('track')">
      Fuatilia Mzigo
    </button>
  </nav>
</header>

<div class="container">

<!-- =========================
     REGISTER
========================= -->

<section id="register" class="card">

<h2>📦 Sajili Mzigo</h2>

<input
  id="cargoName"
  placeholder="Jina la mzigo"
/>

<input
  id="origin"
  placeholder="Mahali unatoka"
/>

<input
  id="destination"
  placeholder="Unapelekwa wapi"
/>

<input
  id="bossName"
  placeholder="Jina la Boss"
/>

<h3>Mawakala / Vituo</h3>

<div id="agents"></div>

<button
  onclick="addAgent()"
>
+ Ongeza Agent
</button>

<button
  class="success"
  onclick="createCargo()"
>
🚚 Sajili Mzigo
</button>

<div id="registerResult"></div>

</section>


<!-- =========================
     LOGIN
========================= -->

<section
  id="login"
  class="card hidden"
>

<h2>🔐 Ingia kwenye Mfumo</h2>

<input
  id="loginTracking"
  placeholder="Tracking ID mfano DAG-123456"
  autocomplete="off"
/>

<input
  id="loginPin"
  placeholder="PIN"
  inputmode="numeric"
  type="password"
/>

<button
  onclick="login()"
>
Ingia
</button>

<div id="loginResult"></div>

</section>


<!-- =========================
     TRACK
========================= -->

<section
  id="track"
  class="card hidden"
>

<h2>🔎 Fuatilia Mzigo</h2>

<input
  id="trackId"
  placeholder="Tracking ID"
/>

<button
  onclick="trackCargo()"
>
Fuatilia
</button>

<div id="trackResult"></div>

</section>


<!-- =========================
     DASHBOARD
========================= -->

<section
  id="dashboard"
  class="card hidden"
>

<h2 id="dashboardTitle">
Dashboard
</h2>

<div
  id="dashboardContent"
></div>

<button
  class="secondary"
  onclick="logout()"
>
Toka
</button>

</section>

</div>

<footer>
MAKYAMA Dagaa Transport © 2026
</footer>


<script type="module">

/* =========================
   SERVER
========================= */

const SERVER =
  "https://makyama-dagaa.onrender.com";


/* =========================
   FIREBASE
========================= */

/*
  WEKA FIREBASE WEB CONFIG YAKO HAPA.

  Usitumie service-account JSON hapa.
*/

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithCustomToken,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "WEKA_FIREBASE_API_KEY_YAKO",

  authDomain:
    "makyama-e5e89.firebaseapp.com",

  databaseURL:
    "https://makyama-e5e89-default-rtdb.firebaseio.com",

  projectId:
    "makyama-e5e89",

  storageBucket:
    "makyama-e5e89.firebasestorage.app",

  messagingSenderId:
    "WEKA_MESSAGING_SENDER_ID",

  appId:
    "WEKA_APP_ID"
};


const firebaseApp =
  initializeApp(
    firebaseConfig
  );

const auth =
  getAuth(
    firebaseApp
  );


/* =========================
   STATE
========================= */

let currentUser =
  null;

let agentsCount = 0;


/* =========================
   SECTIONS
========================= */

window.showSection =
function(section){

  document
    .querySelectorAll("section")
    .forEach(el =>
      el.classList.add("hidden")
    );

  document
    .getElementById(section)
    .classList.remove("hidden");
};


/* =========================
   AGENTS
========================= */

window.addAgent =
function(){

  agentsCount++;

  const div =
    document.createElement("div");

  div.className =
    "agent-row";

  div.id =
    `agent_${agentsCount}`;

  div.innerHTML = `
    <strong>Agent ${agentsCount}</strong>

    <input
      class="agent-name"
      placeholder="Jina la Agent ${agentsCount}"
    />

    <button
      class="danger"
      onclick="removeAgent(${agentsCount})"
    >
      Ondoa
    </button>
  `;

  document
    .getElementById("agents")
    .appendChild(div);
};


window.removeAgent =
function(id){

  const element =
    document.getElementById(
      `agent_${id}`
    );

  if(element){
    element.remove();
  }
};


/* =========================
   CREATE CARGO
========================= */

window.createCargo =
async function(){

  const cargoName =
    document
      .getElementById(
        "cargoName"
      )
      .value.trim();

  const origin =
    document
      .getElementById(
        "origin"
      )
      .value.trim();

  const destination =
    document
      .getElementById(
        "destination"
      )
      .value.trim();

  const bossName =
    document
      .getElementById(
        "bossName"
      )
      .value.trim();

  const agentInputs =
    document.querySelectorAll(
      ".agent-name"
    );

  const agents =
    Array.from(
      agentInputs
    )
    .map(
      input =>
        input.value.trim()
    )
    .filter(Boolean);

  const result =
    document.getElementById(
      "registerResult"
    );

  if(
    !cargoName ||
    !origin ||
    !destination ||
    !bossName ||
    agents.length === 0
  ){

    result.innerHTML = `
      <div class="result error-box">
        Tafadhali jaza taarifa zote
        na ongeza angalau Agent mmoja.
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="result">
      Inatengeneza mzigo...
    </div>
  `;

  try{

    const response =
      await fetch(
        `${SERVER}/api/create-cargo`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            cargoName,
            origin,
            destination,
            agents,
            bossName
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Imeshindikana."
      );
    }

    let agentHTML = "";

    data.agents.forEach(
      agent => {

        agentHTML += `
          <div class="credential">

            <strong>
              Agent ${agent.number}
            </strong>

            <br>

            Jina:
            ${escapeHTML(agent.name)}

            <br>

            PIN:
            <strong>
              ${escapeHTML(agent.pin)}
            </strong>

            <br>

            <span class="small">
              UID: ${escapeHTML(agent.uid)}
            </span>

          </div>
        `;
      }
    );

    result.innerHTML = `

      <div class="result success-box">

        <h3>
          ✅ Mzigo Umesajiliwa
        </h3>

        <p>
          <strong>Tracking ID:</strong>
          ${escapeHTML(data.trackingId)}
        </p>

        <div class="credentials">

          <h3>🔑 Boss</h3>

          Jina:
          ${escapeHTML(data.boss.name)}

          <br>

          PIN:
          <strong>
            ${escapeHTML(data.boss.pin)}
          </strong>

          <hr>

          <h3>👥 Agents</h3>

          ${agentHTML}

        </div>

        <p class="small">
          Hifadhi PIN hizi. PIN hazihifadhiwi
          wazi kwenye database.
        </p>

      </div>
    `;

  }catch(error){

    result.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
};


/* =========================
   LOGIN
========================= */

window.login =
async function(){

  const trackingId =
    document
      .getElementById(
        "loginTracking"
      )
      .value
      .trim()
      .toUpperCase();

  const pin =
    document
      .getElementById(
        "loginPin"
      )
      .value
      .trim();

  const result =
    document.getElementById(
      "loginResult"
    );

  if(
    !trackingId ||
    !pin
  ){

    result.innerHTML = `
      <div class="result error-box">
        Weka Tracking ID na PIN.
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="result">
      Inaingia...
    </div>
  `;

  try{

    const response =
      await fetch(
        `${SERVER}/api/login`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            trackingId,
            pin
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Login imekataa."
      );
    }

    /*
      Convert backend custom token
      into Firebase ID token.
    */

    const credential =
      await signInWithCustomToken(
        auth,
        data.token
      );

    const idToken =
      await credential.user
        .getIdToken();

    currentUser = {
      ...data,
      idToken
    };

    document
      .getElementById(
        "loginResult"
      )
      .innerHTML = "";

    showSection(
      "dashboard"
    );

    renderDashboard();

  }catch(error){

    result.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
};


/* =========================
   DASHBOARD
========================= */

async function renderDashboard(){

  if(!currentUser)
    return;

  const title =
    document.getElementById(
      "dashboardTitle"
    );

  const content =
    document.getElementById(
      "dashboardContent"
    );

  if(
    currentUser.role ===
    "boss"
  ){

    title.innerHTML =
      "👑 Boss Dashboard";

    content.innerHTML = `
      <div class="result">
        Inapakia taarifa za mzigo...
      </div>
    `;

    await renderBossDashboard();

  }else{

    title.innerHTML =
      `🚚 Agent ${currentUser.stage} Dashboard`;

    content.innerHTML = `
      <div class="result">
        Inapakia...
      </div>
    `;

    await renderAgentDashboard();
  }
}


/* =========================
   GET CARGO
========================= */

async function getCargo(){

  const response =
    await fetch(
      `${SERVER}/api/cargo/${encodeURIComponent(
        currentUser.trackingId
      )}`
    );

  const data =
    await response.json();

  if(!response.ok){

    throw new Error(
      data.error ||
      "Cargo haipatikani."
    );
  }

  return data;
}


/* =========================
   AGENT DASHBOARD
========================= */

async function renderAgentDashboard(){

  const content =
    document.getElementById(
      "dashboardContent"
    );

  try{

    const cargo =
      await getCargo();

    const stage =
      cargo.stages.find(
        s =>
          Number(s.order) ===
          Number(
            currentUser.stage
          )
      );

    if(!stage){

      content.innerHTML = `
        <div class="result error-box">
          Stage yako haipo.
        </div>
      `;

      return;
    }

    let buttons = "";

    if(
      Number(
        currentUser.stage
      ) === 1
    ){

      if(
        stage.status ===
        "READY_TO_RELEASE"
      ){

        buttons = `
          <button
            class="success"
            onclick="agentAction('RELEASE')"
          >
            📦 NIMETOA
          </button>
        `;

      }else{

        buttons = `
          <div class="result">
            Huna action kwa sasa.
            <br>
            Status:
            <strong>
              ${escapeHTML(
                stage.status
              )}
            </strong>
          </div>
        `;
      }

    }else{

      if(
        stage.status ===
        "READY_TO_RECEIVE"
      ){

        buttons += `
          <button
            class="success"
            onclick="agentAction('RECEIVE')"
          >
            📥 NIMEPOKEA
          </button>
        `;

      }else if(
        stage.status ===
        "RECEIVED"
      ){

        buttons += `
          <button
            onclick="agentAction('RELEASE')"
          >
            📦 NIMETOA
          </button>
        `;

      }else{

        buttons = `
          <div class="result">
            Subiri mzigo ufike.
            <br>
            Status:
            <strong>
              ${escapeHTML(
                stage.status
              )}
            </strong>
          </div>
        `;
      }
    }

    content.innerHTML = `

      <div class="grid">

        <div class="stat">
          Cargo
          <strong>
            ${escapeHTML(
              cargo.public.cargoName
            )}
          </strong>
        </div>

        <div class="stat">
          Origin
          <strong>
            ${escapeHTML(
              cargo.public.origin
            )}
          </strong>
        </div>

        <div class="stat">
          Destination
          <strong>
            ${escapeHTML(
              cargo.public.destination
            )}
          </strong>
        </div>

      </div>

      <div class="result">

        <h3>
          Agent ${currentUser.stage}
        </h3>

        <p>
          ${escapeHTML(
            currentUser.agentName ||
            ""
          )}
        </p>

        <span class="badge ${statusClass(stage.status)}">
          ${escapeHTML(stage.status)}
        </span>

      </div>

      ${buttons}

      <div id="actionResult"></div>

      <h3>
        Historia
      </h3>

      ${renderHistory(
        cargo.history
      )}
    `;

  }catch(error){

    content.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
}


/* =========================
   BOSS DASHBOARD
========================= */

async function renderBossDashboard(){

  const content =
    document.getElementById(
      "dashboardContent"
    );

  try{

    const cargo =
      await getCargo();

    const completed =
      cargo.public.status ===
      "COMPLETED";

    let stagesHTML = "";

    cargo.stages.forEach(
      stage => {

        stagesHTML += `
          <div class="agent-row">

            <strong>
              Agent ${stage.order}
            </strong>

            <br>

            ${escapeHTML(
              stage.agentName
            )}

            <br><br>

            <span class="badge ${statusClass(stage.status)}">
              ${escapeHTML(
                stage.status
              )}
            </span>

            ${
              stage.receivedLocationName
              ? `
                <div class="location">
                  📍 Amepokea:
                  ${escapeHTML(
                    stage.receivedLocationName
                  )}
                </div>
              `
              : ""
            }

            ${
              stage.releasedLocationName
              ? `
                <div class="location">
                  📍 Ametoa:
                  ${escapeHTML(
                    stage.releasedLocationName
                  )}
                </div>
              `
              : ""
            }

          </div>
        `;
      }
    );

    let bossButton = "";

    if(
      cargo.public.status ===
      "WAITING_FOR_BOSS"
    ){

      bossButton = `
        <button
          class="success"
          onclick="bossReceive()"
        >
          👑 NIMEPOKEA MZIGO
        </button>

        <div id="actionResult"></div>
      `;

    }else if(completed){

      bossButton = `
        <div class="result success-box">
          ✅ Mzigo umekamilika.
          Boss tayari amepokea.
        </div>
      `;

    }else{

      bossButton = `
        <div class="result">
          ⏳ Mzigo bado uko kwenye safari.
        </div>
      `;
    }

    content.innerHTML = `

      <div class="grid">

        <div class="stat">
          Tracking ID
          <strong>
            ${escapeHTML(
              cargo.trackingId
            )}
          </strong>
        </div>

        <div class="stat">
          Status
          <strong>
            ${escapeHTML(
              cargo.public.status
            )}
          </strong>
        </div>

        <div class="stat">
          Route
          <strong>
            ${escapeHTML(
              cargo.public.origin
            )}
            →
            ${escapeHTML(
              cargo.public.destination
            )}
          </strong>
        </div>

      </div>

      <div class="result">

        <h3>
          📦 ${escapeHTML(
            cargo.public.cargoName
          )}
        </h3>

        <p>
          Boss:
          ${escapeHTML(
            cargo.supervisor.bossName
          )}
        </p>

        <span class="badge ${statusClass(cargo.public.status)}">
          ${escapeHTML(
            cargo.public.status
          )}
        </span>

      </div>

      <h3>
        Vituo vya Mzigo
      </h3>

      ${stagesHTML}

      ${bossButton}

      <h3>
        Historia
      </h3>

      ${renderHistory(
        cargo.history
      )}
    `;

  }catch(error){

    content.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
}


/* =========================
   AGENT ACTION
========================= */

window.agentAction =
async function(action){

  const result =
    document.getElementById(
      "actionResult"
    );

  if(!result)
    return;

  result.innerHTML = `
    <div class="result">
      📍 Inapata location yako...
    </div>
  `;

  try{

    const position =
      await getLocation();

    const response =
      await fetch(
        `${SERVER}/api/agent-action`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${currentUser.idToken}`
          },

          body:JSON.stringify({

            trackingId:
              currentUser.trackingId,

            action,

            lat:
              position.coords.latitude,

            lon:
              position.coords.longitude
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Action imekataa."
      );
    }

    result.innerHTML = `
      <div class="result success-box">
        ✅ ${escapeHTML(
          data.message
        )}
      </div>
    `;

    setTimeout(
      renderDashboard,
      800
    );

  }catch(error){

    result.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
};


/* =========================
   BOSS RECEIVE
========================= */

window.bossReceive =
async function(){

  const result =
    document.getElementById(
      "actionResult"
    );

  if(!result)
    return;

  result.innerHTML = `
    <div class="result">
      📍 Inapata location yako...
    </div>
  `;

  try{

    const position =
      await getLocation();

    const response =
      await fetch(
        `${SERVER}/api/boss-receive`,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Authorization":
              `Bearer ${currentUser.idToken}`
          },

          body:JSON.stringify({

            trackingId:
              currentUser.trackingId,

            lat:
              position.coords.latitude,

            lon:
              position.coords.longitude
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Boss receive imekataa."
      );
    }

    result.innerHTML = `
      <div class="result success-box">
        ✅ ${escapeHTML(
          data.message
        )}
      </div>
    `;

    setTimeout(
      renderDashboard,
      800
    );

  }catch(error){

    result.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
};


/* =========================
   LOCATION
========================= */

function getLocation(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "Simu yako haiwezi kupata location."
          )
        );

        return;
      }

      navigator.geolocation.getCurrentPosition(
        resolve,
        error => {

          let message =
            "Imeshindikana kupata location.";

          if(
            error.code === 1
          ){
            message =
              "Ruhusu Location kwenye browser.";
          }

          reject(
            new Error(message)
          );
        },
        {
          enableHighAccuracy:true,
          timeout:15000,
          maximumAge:0
        }
      );
    }
  );
}


/* =========================
   TRACK CARGO
========================= */

window.trackCargo =
async function(){

  const id =
    document
      .getElementById(
        "trackId"
      )
      .value
      .trim()
      .toUpperCase();

  const result =
    document.getElementById(
      "trackResult"
    );

  if(!id){

    result.innerHTML = `
      <div class="result error-box">
        Weka Tracking ID.
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="result">
      Inatafuta mzigo...
    </div>
  `;

  try{

    const response =
      await fetch(
        `${SERVER}/api/cargo/${encodeURIComponent(id)}`
      );

    const data =
      await response.json();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Mzigo haupo."
      );
    }

    let stagesHTML = "";

    data.stages.forEach(
      stage => {

        stagesHTML += `
          <div class="agent-row">

            <strong>
              Stage ${stage.order}
            </strong>

            <br>

            ${escapeHTML(
              stage.agentName
            )}

            <br><br>

            <span class="badge ${statusClass(stage.status)}">
              ${escapeHTML(
                stage.status
              )}
            </span>

            ${
              stage.receivedLocationName
              ? `
                <div class="location">
                  📍 ${escapeHTML(
                    stage.receivedLocationName
                  )}
                </div>
              `
              : ""
            }

            ${
              stage.releasedLocationName
              ? `
                <div class="location">
                  📍 ${escapeHTML(
                    stage.releasedLocationName
                  )}
                </div>
              `
              : ""
            }

          </div>
        `;
      }
    );

    result.innerHTML = `

      <div class="result success-box">

        <h3>
          📦 ${escapeHTML(
            data.public.cargoName
          )}
        </h3>

        <p>
          <strong>
            ${escapeHTML(
              data.trackingId
            )}
          </strong>
        </p>

        <p>
          ${escapeHTML(
            data.public.origin
          )}
          →
          ${escapeHTML(
            data.public.destination
          )}
        </p>

        <span class="badge ${statusClass(data.public.status)}">
          ${escapeHTML(
            data.public.status
          )}
        </span>

      </div>

      <h3>
        Safari ya Mzigo
      </h3>

      ${stagesHTML}

      <h3>
        Historia
      </h3>

      ${renderHistory(
        data.history
      )}
    `;

  }catch(error){

    result.innerHTML = `
      <div class="result error-box">
        ❌ ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
};


/* =========================
   HISTORY
========================= */

function renderHistory(
  history
){

  const items =
    Object.values(
      history || {}
    )
    .sort(
      (a,b)=>
        (b.timestamp || 0) -
        (a.timestamp || 0)
    );

  if(
    items.length === 0
  ){

    return `
      <div class="result">
        Hakuna history bado.
      </div>
    `;
  }

  return items.map(
    item => {

      const date =
        item.timestamp
        ? new Date(
            item.timestamp
          ).toLocaleString(
            "sw-TZ"
          )
        : "";

      return `
        <div class="history">

          <strong>
            ${escapeHTML(
              item.type || ""
            )}
          </strong>

          ${
            item.stage
            ? `
              <div>
                Stage:
                ${escapeHTML(
                  String(
                    item.stage
                  )
                )}
              </div>
            `
            : ""
          }

          ${
            item.locationName
            ? `
              <div>
                📍 ${escapeHTML(
                  item.locationName
                )}
              </div>
            `
            : ""
          }

          <div class="small">
            ${escapeHTML(date)}
          </div>

        </div>
      `;
    }
  ).join("");
}

/* =========================
   HELPERS
========================= */

function statusClass(
  status
){

  if(
    status ===
    "COMPLETED"
  ){
    return "completed";
  }

  if(
    status ===
    "RECEIVED"
  ){
    return "received";
  }

  if(
    status ===
    "RELEASED"
  ){
    return "released";
  }

  if(
    status ===
      "READY_TO_RECEIVE" ||
    status ===
      "READY_TO_RELEASE"
  ){
    return "ready";
  }

  return "waiting";
}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  )
  .replaceAll(
    "'",
    "&#039;"
  );
}
