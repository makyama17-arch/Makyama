<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MAKYAMA Dagaa Transport</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7f9;
  color:#17212b;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:5px 0 0;
  opacity:.8;
}

.container{
  width:94%;
  max-width:700px;
  margin:20px auto;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

input,
textarea,
button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  background:#111827;
  color:white;
  border:0;
  cursor:pointer;
  font-weight:bold;
}

button:disabled{
  opacity:.5;
}

.agentRow{
  display:flex;
  gap:8px;
}

.agentRow input{
  flex:1;
}

.hidden{
  display:none;
}

.status{
  padding:12px;
  border-radius:10px;
  margin:10px 0;
  background:#eef2ff;
}

.success{
  background:#dcfce7;
}

.error{
  background:#fee2e2;
}

.stage{
  border:1px solid #ddd;
  padding:13px;
  border-radius:10px;
  margin:10px 0;
}

#map{
  height:400px;
  border-radius:12px;
  margin-top:15px;
}

.credential{
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  margin:8px 0;
}

</style>

</head>

<body>

<header>

<h1>MAKYAMA</h1>
<p>Dagaa Transport System</p>

</header>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h2>🔐 Ingia</h2>

<input
id="trackingInput"
placeholder="Tracking ID mfano DAG-123456">

<input
id="pinInput"
placeholder="PIN"
type="password">

<button onclick="login()">
INGIA
</button>

<div id="loginMessage"></div>

</div>


<!-- APP -->

<div id="app" class="hidden">

<div class="card">

<h2 id="roleTitle"></h2>

<div id="cargoInfo"></div>

</div>


<div id="agentArea"></div>


<div id="bossArea"></div>


<div id="map"></div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithCustomToken
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
  "AIzaSyBe2Qr-75nBWLLE5GDNBvhGFT91FtBbBw",

  authDomain:
  "makyama-e5e89.firebaseapp.com",

  databaseURL:
  "https://makyama-e5e89-default-rtdb.firebaseio.com",

  projectId:
  "makyama-e5e89",

  storageBucket:
  "makyama-e5e89.firebasestorage.app",

  messagingSenderId:
  "229527204095",

  appId:
  "1:229527204095:web:2bdfe0589cf42794b3dcca"
};

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getDatabase(firebaseApp);


/* =========================
   SERVER URL
=========================

   Kwenye Netlify badilisha hii
   iwe URL ya Render yako.

*/

const SERVER =
  "https://YOUR-RENDER-URL.onrender.com";


let currentToken = null;
let currentRole = null;
let currentStage = null;
let currentTracking = null;

let map;
let markers = [];


/* =========================
   LOGIN
========================= */

window.login = async function(){

  const trackingId =
    document
      .getElementById("trackingInput")
      .value
      .trim()
      .toUpperCase();

  const pin =
    document
      .getElementById("pinInput")
      .value
      .trim();

  const message =
    document.getElementById(
      "loginMessage"
    );

  message.innerHTML =
    "Inaingia...";

  try{

    const response =
      await fetch(
        SERVER + "/api/login",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            trackingId,
            pin
          })
        }
      );

    const data =
      await response.json();

    if(!response.ok){
      throw new Error(
        data.error || "Login failed"
      );
    }

    currentToken =
      data.token;

    currentRole =
      data.role;

    currentStage =
      data.stage || null;

    currentTracking =
      data.trackingId;

    await signInWithCustomToken(
      auth,
      currentToken
    );

    document
      .getElementById("loginCard")
      .classList.add("hidden");

    document
      .getElementById("app")
      .classList.remove("hidden");

    loadCargo();

  }catch(error){

    message.innerHTML =
      `<div class="status error">
        ${error.message}
      </div>`;
  }
};


/* =========================
   LOAD CARGO
========================= */

function loadCargo(){

  /*
    Public data inaweza kusomwa na
    agent aliyelogin.

  */

  onValue(
    ref(
      db,
      `cargo/${currentTracking}/public`
    ),
    snapshot => {

      const data =
        snapshot.val();

      if(!data) return;

      document
        .getElementById("roleTitle")
        .innerText =
          currentRole === "boss"
          ? "👑 BOSS"
          : `1️⃣ AGENT ${currentStage}`;

      document
        .getElementById("cargoInfo")
        .innerHTML = `

          <p><b>Dagaa:</b>
          ${escapeHtml(data.cargoName)}</p>

          <p><b>Origin:</b>
          ${escapeHtml(data.origin)}</p>

          <p><b>Destination:</b>
          ${escapeHtml(data.destination)}</p>

          <p><b>Status:</b>
          ${escapeHtml(data.status)}</p>
        `;

      if(
        currentRole === "boss"
      ){
        loadBossData();
      }

      else if(
        currentStage === 1
      ){
        loadAgentOne();
      }

      else{
        loadNormalAgent();
      }

    }
  );
}


/* =========================
   AGENT 1
========================= */

function loadAgentOne(){

  document
    .getElementById("agentArea")
    .innerHTML = `

      <div class="card">

        <h2>🚚 Agent 1</h2>

        <p>
        Wewe ni Agent wa kwanza.
        Hupokei mzigo. Kazi yako ni
        <b>NIMETOA</b>.
        </p>

        <button
          id="releaseBtn"
          onclick="agentAction('RELEASE')">

          ✓ NIMETOA MZIGO

        </button>

      </div>
    `;
}


/* =========================
   NORMAL AGENT
========================= */

function loadNormalAgent(){

  onValue(
    ref(
      db,
      `cargo/${currentTracking}/stages/stage_${currentStage}/public`
    ),

    snapshot => {

      const stage =
        snapshot.val();

      if(!stage) return;

      let html = `
        <div class="card">

          <h2>
            🚚 Hatua yako
          </h2>

          <div class="stage">

            <p>
              <b>Status:</b>
              ${escapeHtml(stage.status)}
            </p>
      `;

      if(
        stage.status ===
        "READY_TO_RECEIVE"
      ){

        html += `
          <button
            onclick="agentAction('RECEIVE')">

            ✓ NIMEPOKEA MZIGO

          </button>
        `;
      }

      if(
        stage.status ===
        "RECEIVED"
      ){

        html += `
          <div class="status success">
            UmeshaPOKEA mzigo.
          </div>

          <button
            onclick="agentAction('RELEASE')">

            ✓ NIMETOA MZIGO

          </button>
        `;
      }

      if(
        stage.status ===
        "RELEASED"
      ){

        html += `
          <div class="status success">
            Umeshautoa mzigo.
          </div>
        `;
      }

      html += `
          </div>
        </div>
      `;

      document
        .getElementById("agentArea")
        .innerHTML = html;
    }
  );
}


/* =========================
   AGENT ACTION
========================= */

window.agentAction =
async function(action){

  if(!navigator.geolocation){

    alert(
      "Simu yako haiungi mkono GPS."
    );

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async position => {

      try{

        const lat =
          position.coords.latitude;

        const lon =
          position.coords.longitude;

        const response =
          await fetch(
            SERVER + "/api/agent-action",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  currentToken
              },

              body:JSON.stringify({
                trackingId:
                  currentTracking,

                action,

                lat,

                lon
              })
            }
          );

        const data =
          await response.json();

        if(!response.ok){

          alert(
            data.error ||
            "Action imekataliwa."
          );

          return;
        }

        alert(data.message);

      }catch(error){

        alert(
          "Server haipatikani."
        );
      }

    },

    () => {

      alert(
        "Washa GPS ili kufanya action."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
};


/* =========================
   BOSS
========================= */

function loadBossData(){

  document
    .getElementById("bossArea")
    .innerHTML = `

      <div class="card">

        <h2>👑 Boss Dashboard</h2>

        <div id="bossStages">
          Inapakia...
        </div>

        <button
          onclick="bossReceive()">

          ✓ BOSS NIMEPOKEA MZIGO

        </button>

      </div>
    `;

  onValue(
    ref(
      db,
      `cargo/${currentTracking}`
    ),

    snapshot => {

      const cargo =
        snapshot.val();

      if(!cargo) return;

      let html = "";

      const stages =
        cargo.stages || {};

      for(
        const [id, stage]
        of Object.entries(stages)
      ){

        html += `

          <div class="stage">

            <b>
              Agent ${stage.order}
            </b>

            <p>
              Jina:
              ${escapeHtml(
                stage.private?.agentName ||
                ""
              )}
            </p>

            <p>
              Status:
              ${escapeHtml(
                stage.public?.status ||
                ""
              )}
            </p>

            ${
              stage.public?.receivedLocationName
              ? `<p>
                  📍 Pokea:
                  ${escapeHtml(
                    stage.public.receivedLocationName
                  )}
                </p>`
              : ""
            }

            ${
              stage.public?.releasedLocationName
              ? `<p>
                  📍 Toa:
                  ${escapeHtml(
                    stage.public.releasedLocationName
                  )}
                </p>`
              : ""
            }

          </div>
        `;
      }

      document
        .getElementById("bossStages")
        .innerHTML = html;
    }
  );
}


/* =========================
   BOSS RECEIVE
========================= */

window.bossReceive =
async function(){

  if(!navigator.geolocation){

    alert("GPS haipo.");

    return;
  }

  navigator.geolocation.getCurrentPosition(

    async position => {

      const lat =
        position.coords.latitude;

      const lon =
        position.coords.longitude;

      try{

        const response =
          await fetch(
            SERVER + "/api/boss-receive",
            {
              method:"POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " +
                  currentToken
              },

              body:JSON.stringify({
                trackingId:
                  currentTracking,

                lat,
                lon
              })
            }
          );

        const data =
          await response.json();

        if(!response.ok){

          alert(
            data.error
          );

          return;
        }

        alert(
          data.message
        );

      }catch{

        alert(
          "Server haipatikani."
        );
      }

    },

    () => {

      alert(
        "Washa GPS kwanza."
      );

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

</script>

</body>
</html>
